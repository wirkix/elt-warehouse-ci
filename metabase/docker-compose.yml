services:
  metabase:
    image: metabase/metabase:latest
    volumes:
      - metabase-data:/metabase-data
      # Databricks JDBC driver plugin -- Metabase doesn't ship it by
      # default, see SETUP.md step 2 for where this jar comes from.
      - ./plugins:/plugins
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SESSION_SECRET_KEY: ${MB_SESSION_SECRET_KEY:?set in metabase/.env, see .env.example}
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY:?set in metabase/.env, see .env.example}
    restart: always
    expose:
      - "3000"

  caddy:
    image: caddy:2
    depends_on:
      - metabase
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    restart: always

volumes:
  metabase-data:
  caddy-data:
